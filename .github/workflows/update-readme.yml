name: Update README Latest Activity

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run unit tests
        run: node --test scripts/*.test.mjs scripts/lib/*.test.mjs

      # The default GITHUB_TOKEN cannot always read a user's
      # contributionsCollection over GraphQL. If the run logs
      # "WARN contributions:", the streak and commit badges will stay empty —
      # add a personal access token with `read:user` as a repository secret
      # named PROFILE_TOKEN and it is picked up here automatically, with no
      # change to this file.
      - name: Update profile README
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update README Latest Activity"
            git push
          else
            echo "No changes to commit."
          fi
